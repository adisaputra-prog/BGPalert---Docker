server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: bgpalerter
    static_configs:
      - targets:
          - localhost
        labels:
          job: bgpalerter
          service: bgpalerter
          log_type: reports
          __path__: /var/log/bgpalerter/reports*.log

      - targets:
          - localhost
        labels:
          job: bgpalerter
          service: bgpalerter
          log_type: error
          __path__: /var/log/bgpalerter/error*.log
